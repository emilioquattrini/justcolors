<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JUSTCOLORS — Analytics</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#171717;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #ddd}header b{letter-spacing:.12em}main{max-width:1100px;margin:auto;padding:28px 18px}h1{font-size:clamp(27px,5vw,45px);letter-spacing:-.045em}h2{font-size:20px}button,input{font:inherit}button{cursor:pointer;border-radius:7px;border:1px solid #222;padding:10px 15px;background:#fff}button.active,button.primary{background:#151515;color:#fff}input{padding:12px;border:1px solid #ccc;border-radius:6px;width:100%;margin:5px 0 13px}.panel{background:#fff;border:1px solid #ddd;border-radius:13px;padding:22px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{background:#fff;border:1px solid #ddd;border-radius:10px;padding:17px}.metric strong{display:block;font-size:34px;margin-top:9px}.muted{color:#777;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.barline{display:flex;align-items:center;gap:10px;margin:10px 0}.barline span{width:120px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bartrack{background:#eee;flex:1;height:16px;border-radius:3px}.bar{background:#1d1d1d;height:100%;border-radius:3px}.barline b{font-size:12px;width:22px;text-align:right}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:11px 7px;border-bottom:1px solid #eee}th{color:#777;font-weight:500}.scroll{overflow-x:auto}#login{max-width:420px;margin:70px auto}.hide{display:none!important}#message{white-space:pre-wrap;margin:12px 0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .btnlight{border-color:#ddd} @media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}header{padding:15px}main{padding:16px 12px}.panel{padding:15px}h1{font-size:32px}}</style></head><body>
<header><b>JUSTCOLORS <span style="color:#aaa">/ DATA STUDIO</span></b><div class="toolbar"><span class="muted" id="updated"></span><button class="btnlight hide" id="logout">Esci</button></div></header>
<main><section id="login" class="panel"><h1>Accesso riservato</h1><p class="muted">Dashboard interna Big Match e Vague Vase. Accedi con un account autorizzato.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Accedi</button></form><p class="muted">I dati personali sono visibili solo agli amministratori autorizzati.</p><div id="message" role="status"></div></section>
<section id="dash" class="hide"><div class="toolbar" style="justify-content:space-between"><div><h1>Analytics dashboard</h1><p class="muted">Dati in tempo reale da Supabase · nessun pagamento o ordine confermato implicito</p></div><button id="refresh">↻ Aggiorna</button></div><div class="tabs"><button id="tmatch" class="active">Big Match</button><button id="tvase">Vague Vase</button></div><div id="content"></div></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const url='https://zwjzlzyqsqxqtjxhgmbs.supabase.co',key='sb_publishable_TU_GC-BZ9hE6GBtF4mPLZQ_qLZyfSQd';
const client=createClient(url,key);const $=id=>document.getElementById(id);let data=null,tab='match';
const safe=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString('it-IT',{timeZone:'Europe/Rome',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const metric=(label,value,sub='')=>'<div class="metric"><small class="muted">'+safe(label)+'</small><strong>'+safe(value)+'</strong><small class="muted">'+safe(sub)+'</small></div>';
function bars(values){let max=Math.max(1,...values.map(v=>v[1]));return values.length?values.map(([k,n])=>'<div class="barline"><span title="'+safe(k)+'">'+safe(k)+'</span><div class="bartrack"><div class="bar" style="width:'+Math.round(n/max*100)+'%"></div></div><b>'+n+'</b></div>').join(''):'<p class="muted">Ancora nessun dato.</p>'}
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+safe(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+safe(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function group(rows,fn){let out={};for(let r of rows){let k=fn(r);out[k]=(out[k]||0)+1;}return Object.entries(out).sort((a,b)=>b[1]-a[1])}
function day(s){return new Date(s).toLocaleDateString('it-IT',{timeZone:'Europe/Rome',day:'2-digit',month:'short'})}
function render(){if(!data)return;$('tmatch').classList.toggle('active',tab==='match');$('tvase').classList.toggle('active',tab==='vase');
if(tab==='match'){const p=data.participations||[],pre=data.preorders||[],co=data.contacts||[],ev=data.events||[],cards=data.cards||[];
const names={};for(let e of ev)for(let c of cards)if(c.deck_version===e.deck_version)names[e.id+':'+c.id]=c.name;
const counts={};for(let r of p)for(let k of ['card_a','card_b','card_c']){const n=names[r.event_id+':'+r[k]]||'#'+r[k];counts[n]=(counts[n]||0)+1}
const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
$('content').innerHTML='<div class="cards">'+metric('Partite registrate',p.length)+metric('Carte selezionate',p.length*3)+metric('Contatti da modulo',co.length)+metric('Preordini Impersonae',pre.length)+'</div><div class="cols"><div class="panel"><h2>Partite per giorno</h2>'+bars(group(p,r=>day(r.created_at)))+'</div><div class="panel"><h2>Carte più selezionate</h2>'+bars(ranked)+'</div></div><div class="panel"><h2>Cronologia delle partite</h2>'+table(['Data','Carta 1','Carta 2','Carta 3'],[...p].sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(r=>[date(r.created_at),names[r.event_id+':'+r.card_a]||r.card_a,names[r.event_id+':'+r.card_b]||r.card_b,names[r.event_id+':'+r.card_c]||r.card_c]))+'</div><div class="panel"><h2>Preordini Impersonae</h2>'+table(['Data','Nome','Email','Quantità','Stato'],pre.map(x=>[date(x.created_at),x.name,x.email,x.quantity,x.status]))+'</div><div class="panel"><h2>Contatti Big Match</h2>'+table(['Data','Nome','Email','Stato'],co.map(x=>[date(x.created_at),x.name,x.email,x.status]))+'</div>';
}else{const v=data.vases||[];const sum=v.reduce((s,x)=>s+(+x.quantity||0),0);const prices=v.reduce((s,x)=>s+(Number(x.potential_value)||0),0);
$('content').innerHTML='<div class="cards">'+metric('Richieste',v.length)+metric('Unità richieste',sum)+metric('Valore indicativo preordini','€ '+prices.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}),'Solo richieste con prezzo valorizzato')+metric('Email raccolte',v.filter(x=>x.email).length)+'</div><div class="cols"><div class="panel"><h2>Richieste per giorno</h2>'+bars(group(v,r=>day(r.created_at)))+'</div><div class="panel"><h2>Preferenze prodotto</h2>'+bars(group(v,r=>r.product_label||r.version_label||'Altro'))+'</div></div><div class="panel"><h2>Richieste Vague Vase</h2>'+table(['Data','Riferimento','Nome','Email','Versione','Qtà','Stato'],[...v].sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(r=>[date(r.created_at),r.reference_code,r.full_name,r.email,r.product_label||r.version_label,r.quantity,r.status]))+'</div>';}
}
async function load(){try{$('updated').textContent='Aggiornamento…';const {data:s}=await client.auth.getSession();if(!s.session){$('login').classList.remove('hide');$('dash').classList.add('hide');return;}const res=await fetch(url+'/functions/v1/justcolors-dashboard',{headers:{Authorization:'Bearer '+s.session.access_token,apikey:key}});const j=await res.json();if(!res.ok)throw Error(j.error||'Errore API');data=j;$('login').classList.add('hide');$('dash').classList.remove('hide');$('logout').classList.remove('hide');$('updated').textContent='Aggiornato '+date(j.updated_at);render()}catch(err){$('message').textContent=err.message;$('updated').textContent='Accesso non autorizzato';$('login').classList.remove('hide');$('dash').classList.add('hide')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='Accesso in corso…';const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('message').textContent=error.message;return;}$('message').textContent='';await load()};
$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};$('refresh').onclick=load;$('tmatch').onclick=()=>{tab='match';render()};$('tvase').onclick=()=>{tab='vase';render()};load();
</script></body></html>

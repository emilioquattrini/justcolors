name: Validate build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Admin data tests
        run: node --experimental-strip-types --test tests/preorders.test.ts

      - name: Admin lint
        run: npx eslint src/pages/VagueVaseAdmin.tsx src/lib/adminClient.ts src/lib/preorders.ts

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Admin desktop and mobile tests
        run: npx playwright test
